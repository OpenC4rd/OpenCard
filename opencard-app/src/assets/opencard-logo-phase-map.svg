<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <title>OpenCard 相位图</title>
  <!--
    与 opencard-logo.svg 同一套几何与叠压（半径 300 的圆弧 + stroke-width 200），只把调色板换成灰度：
    相位 0 → 255 正好铺满四个环，每一档 1/15 = 0x11。
    环1 0–68、环2 68–119、环3 136–204、环4 204–255（中间空掉 7/15–8/15 那一档）。
    注意：这份是平滑矢量版；运行时给相位动画用的纹理仍是抖动过的 opencard-logo-phase-map.png。
  -->
  <defs>
    <linearGradient id="r1a" gradientUnits="userSpaceOnUse" x1="400" y1="700" x2="100" y2="400"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <linearGradient id="r1b" gradientUnits="userSpaceOnUse" x1="100" y1="400" x2="400" y2="100"><stop offset="0" stop-color="#111111"/><stop offset="1" stop-color="#222222"/></linearGradient>
    <linearGradient id="r1c" gradientUnits="userSpaceOnUse" x1="400" y1="100" x2="700" y2="400"><stop offset="0" stop-color="#222222"/><stop offset="1" stop-color="#333333"/></linearGradient>
    <linearGradient id="r1d" gradientUnits="userSpaceOnUse" x1="700" y1="400" x2="400" y2="700"><stop offset="0" stop-color="#333333"/><stop offset="1" stop-color="#444444"/></linearGradient>

    <linearGradient id="r2a" gradientUnits="userSpaceOnUse" x1="400" y1="700" x2="100" y2="1000"><stop offset="0" stop-color="#444444"/><stop offset="1" stop-color="#555555"/></linearGradient>
    <linearGradient id="r2b" gradientUnits="userSpaceOnUse" x1="100" y1="1000" x2="400" y2="1300"><stop offset="0" stop-color="#555555"/><stop offset="1" stop-color="#666666"/></linearGradient>
    <linearGradient id="r2c" gradientUnits="userSpaceOnUse" x1="400" y1="1300" x2="700" y2="1000"><stop offset="0" stop-color="#666666"/><stop offset="1" stop-color="#777777"/></linearGradient>

    <linearGradient id="r3a" gradientUnits="userSpaceOnUse" x1="1000" y1="700" x2="1300" y2="1000"><stop offset="0" stop-color="#888888"/><stop offset="1" stop-color="#999999"/></linearGradient>
    <linearGradient id="r3b" gradientUnits="userSpaceOnUse" x1="1300" y1="1000" x2="1000" y2="1300"><stop offset="0" stop-color="#999999"/><stop offset="1" stop-color="#aaaaaa"/></linearGradient>
    <linearGradient id="r3c" gradientUnits="userSpaceOnUse" x1="1000" y1="1300" x2="700" y2="1000"><stop offset="0" stop-color="#aaaaaa"/><stop offset="1" stop-color="#bbbbbb"/></linearGradient>
    <linearGradient id="r3d" gradientUnits="userSpaceOnUse" x1="700" y1="1000" x2="1000" y2="700"><stop offset="0" stop-color="#bbbbbb"/><stop offset="1" stop-color="#cccccc"/></linearGradient>

    <linearGradient id="r4a" gradientUnits="userSpaceOnUse" x1="1000" y1="700" x2="1300" y2="400"><stop offset="0" stop-color="#cccccc"/><stop offset="1" stop-color="#dddddd"/></linearGradient>
    <linearGradient id="r4b" gradientUnits="userSpaceOnUse" x1="1300" y1="400" x2="1000" y2="100"><stop offset="0" stop-color="#dddddd"/><stop offset="1" stop-color="#eeeeee"/></linearGradient>
    <linearGradient id="r4c" gradientUnits="userSpaceOnUse" x1="1000" y1="100" x2="700" y2="400"><stop offset="0" stop-color="#eeeeee"/><stop offset="1" stop-color="#ffffff"/></linearGradient>

    <mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1400">
      <rect width="1400" height="1400" fill="#fff"/>
      <circle cx="400" cy="400" r="425" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke-width="200">
    <path d="M400 700A300 300 0 0 1 100 400" stroke="url(#r1a)"/>
    <path d="M100 400A300 300 0 0 1 400 100" stroke="url(#r1b)"/>
    <path d="M400 100A300 300 0 0 1 700 400" stroke="url(#r1c)"/>
    <path d="M700 400A300 300 0 0 1 400 700" stroke="url(#r1d)"/>

    <path d="M400 700A300 300 0 0 0 100 1000" stroke="url(#r2a)"/>
    <path d="M100 1000A300 300 0 0 0 400 1300" stroke="url(#r2b)"/>
    <path d="M400 1300A300 300 0 0 0 700 1000" stroke="url(#r2c)"/>

    <path d="M1000 700A300 300 0 0 1 1300 1000" stroke="url(#r3a)"/>
    <path d="M1300 1000A300 300 0 0 1 1000 1300" stroke="url(#r3b)"/>
    <path d="M1000 1300A300 300 0 0 1 700 1000" stroke="url(#r3c)"/>
    <path d="M700 1000A300 300 0 0 1 1000 700" stroke="url(#r3d)"/>

    <path d="M1000 700A300 300 0 0 0 1300 400" stroke="url(#r4a)" mask="url(#m4)"/>
    <path d="M1300 400A300 300 0 0 0 1000 100" stroke="url(#r4b)" mask="url(#m4)"/>
    <path d="M1000 100A300 300 0 0 0 700 400" stroke="url(#r4c)" mask="url(#m4)"/>
  </g>
</svg>
