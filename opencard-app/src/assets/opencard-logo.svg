<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <title>OpenCard</title>
  <!--
    四个圆环：半径 300 的圆弧 + stroke-width 200，等于外径 400 / 内径 200，环宽全靠线宽。
    角向渐变：相位从 0/68/136/204 起，每 90° 走 1/15，接缝处硬跳——SVG 没有 conic 渐变，
    所以每圈切成 4 段 90° 圆弧，每段配一条切向 linearGradient。
    叠放（下→上）：环1 左上 → 环2 左下 → 环3 右下 → 环4 右上。
    环2 缺第一象限、环4 缺第三象限，直接体现为圆弧缺口（270°）；环4 另需让开环1，
    半径 425 以内一律不画（掩膜），于是两者之间留下 25px 缝。
  -->
  <defs>
    <!-- 环1 左上：从 -y 顺时针一整圈，相位 0 → 68 -->
    <linearGradient id="r1a" gradientUnits="userSpaceOnUse" x1="400" y1="700" x2="100" y2="400"><stop offset="0" stop-color="#488ff9"/><stop offset="1" stop-color="#4d8af9"/></linearGradient>
    <linearGradient id="r1b" gradientUnits="userSpaceOnUse" x1="100" y1="400" x2="400" y2="100"><stop offset="0" stop-color="#4d8af9"/><stop offset="1" stop-color="#5185f9"/></linearGradient>
    <linearGradient id="r1c" gradientUnits="userSpaceOnUse" x1="400" y1="100" x2="700" y2="400"><stop offset="0" stop-color="#5185f9"/><stop offset="1" stop-color="#5680f9"/></linearGradient>
    <linearGradient id="r1d" gradientUnits="userSpaceOnUse" x1="700" y1="400" x2="400" y2="700"><stop offset="0" stop-color="#5680f9"/><stop offset="1" stop-color="#5b7bf9"/></linearGradient>

    <!-- 环2 左下：从 +y 逆时针到 +x，相位 68 → 119；第一象限整段不画 -->
    <linearGradient id="r2a" gradientUnits="userSpaceOnUse" x1="400" y1="700" x2="100" y2="1000"><stop offset="0" stop-color="#5b7bf9"/><stop offset="1" stop-color="#6077f9"/></linearGradient>
    <linearGradient id="r2b" gradientUnits="userSpaceOnUse" x1="100" y1="1000" x2="400" y2="1300"><stop offset="0" stop-color="#6077f9"/><stop offset="1" stop-color="#6572f9"/></linearGradient>
    <linearGradient id="r2c" gradientUnits="userSpaceOnUse" x1="400" y1="1300" x2="700" y2="1000"><stop offset="0" stop-color="#6572f9"/><stop offset="1" stop-color="#696df9"/></linearGradient>

    <!-- 环3 右下：从 +y 顺时针一整圈，相位 136 → 204 -->
    <linearGradient id="r3a" gradientUnits="userSpaceOnUse" x1="1000" y1="700" x2="1300" y2="1000"><stop offset="0" stop-color="#6e68f9"/><stop offset="1" stop-color="#7363f9"/></linearGradient>
    <linearGradient id="r3b" gradientUnits="userSpaceOnUse" x1="1300" y1="1000" x2="1000" y2="1300"><stop offset="0" stop-color="#7363f9"/><stop offset="1" stop-color="#785ef9"/></linearGradient>
    <linearGradient id="r3c" gradientUnits="userSpaceOnUse" x1="1000" y1="1300" x2="700" y2="1000"><stop offset="0" stop-color="#785ef9"/><stop offset="1" stop-color="#7d59f9"/></linearGradient>
    <linearGradient id="r3d" gradientUnits="userSpaceOnUse" x1="700" y1="1000" x2="1000" y2="700"><stop offset="0" stop-color="#7d59f9"/><stop offset="1" stop-color="#8154f9"/></linearGradient>

    <!-- 环4 右上：从 -y 逆时针到 -x，相位 204 → 255；第三象限整段不画 -->
    <linearGradient id="r4a" gradientUnits="userSpaceOnUse" x1="1000" y1="700" x2="1300" y2="400"><stop offset="0" stop-color="#8154f9"/><stop offset="1" stop-color="#864ff9"/></linearGradient>
    <linearGradient id="r4b" gradientUnits="userSpaceOnUse" x1="1300" y1="400" x2="1000" y2="100"><stop offset="0" stop-color="#864ff9"/><stop offset="1" stop-color="#8b4af9"/></linearGradient>
    <linearGradient id="r4c" gradientUnits="userSpaceOnUse" x1="1000" y1="100" x2="700" y2="400"><stop offset="0" stop-color="#8b4af9"/><stop offset="1" stop-color="#9045f9"/></linearGradient>

    <mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1400">
      <rect width="1400" height="1400" fill="#fff"/>
      <circle cx="400" cy="400" r="425" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke-width="200">
    <!-- 环1 左上（最底层） -->
    <path d="M400 700A300 300 0 0 1 100 400" stroke="url(#r1a)"/>
    <path d="M100 400A300 300 0 0 1 400 100" stroke="url(#r1b)"/>
    <path d="M400 100A300 300 0 0 1 700 400" stroke="url(#r1c)"/>
    <path d="M700 400A300 300 0 0 1 400 700" stroke="url(#r1d)"/>

    <!-- 环2 左下 -->
    <path d="M400 700A300 300 0 0 0 100 1000" stroke="url(#r2a)"/>
    <path d="M100 1000A300 300 0 0 0 400 1300" stroke="url(#r2b)"/>
    <path d="M400 1300A300 300 0 0 0 700 1000" stroke="url(#r2c)"/>

    <!-- 环3 右下 -->
    <path d="M1000 700A300 300 0 0 1 1300 1000" stroke="url(#r3a)"/>
    <path d="M1300 1000A300 300 0 0 1 1000 1300" stroke="url(#r3b)"/>
    <path d="M1000 1300A300 300 0 0 1 700 1000" stroke="url(#r3c)"/>
    <path d="M700 1000A300 300 0 0 1 1000 700" stroke="url(#r3d)"/>

    <!-- 环4 右上（最上层） -->
    <path d="M1000 700A300 300 0 0 0 1300 400" stroke="url(#r4a)" mask="url(#m4)"/>
    <path d="M1300 400A300 300 0 0 0 1000 100" stroke="url(#r4b)" mask="url(#m4)"/>
    <path d="M1000 100A300 300 0 0 0 700 400" stroke="url(#r4c)" mask="url(#m4)"/>
  </g>
</svg>
