<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <title>OpenCard</title>
  <!--
    单色版：几何与叠压和 opencard-logo.svg 一致，去掉角向渐变，只留形状。
    每条环 = 半径 300 的圆弧 + stroke-width 200（等于外径 400 / 内径 200），环宽全靠线宽。
    整圆要两条 180° 弧（单条 A 的起终点相同会被忽略）；环2、环4 被清空的象限就是圆弧缺口。
    单色时重叠无所谓，所以环1~3 合成一条 path；环4 必须单独一条，因为它要挂让位掩膜。
  -->
  <defs>
    <!-- 环4 要让开环1：半径 425 以内一律不画，于是两环之间留下 25px 缝 -->
    <mask id="m4" maskUnits="userSpaceOnUse" x="0" y="0" width="1400" height="1400">
      <rect width="1400" height="1400" fill="#fff"/>
      <circle cx="400" cy="400" r="425" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="200">
    <!-- 环1 左上整圈 + 环2 左下（缺第一象限）+ 环3 右下整圈 -->
    <path d="M400 100A300 300 0 1 0 400 700A300 300 0 1 0 400 100M400 700A300 300 0 1 0 700 1000M1000 700A300 300 0 1 1 1000 1300A300 300 0 1 1 1000 700"/>
    <!-- 环4 右上（缺第三象限，并让开环1） -->
    <path d="M1000 700A300 300 0 1 0 700 400" mask="url(#m4)"/>
  </g>
</svg>
