<?xml version="1.0" encoding="UTF-8"?>
<!--
  .ocpack 的文件类型图标：单个自足的 SVG，没有外部引用。
  · 包箱体就是你给的那条 mdi 路径（package-variant-closed），logo 位置先挖出圆形占位区，
    再叠加 4o 标志，箱体轮廓本身不做形变。
    上色：没有描边，只填灰色 #808080，透明度 10%（fill-opacity 0.9）。
  · 右下角放 OpenCard 的 4o 标志（形状取自 src/assets/opencard-logo-solid.svg，半径 300、环宽 200），
    占原来叉子那个 7x7 徽标框并放大到 140%：translate(14.1 14.1) scale(0.007)，即 9.8x9.8、
    中心仍在 (19,19)（原来那个叉子的中心），整块都在 0–24 画布内，不会被裁。
    上色与箱体一致：灰色 #808080、透明度 10%（stroke-opacity 0.9）——整张图只有一个灰色。
  · 环4 让开环1 的让位遮罩按源文件原样搬来（区域放大，免得描边外缘正好压在区域边界上被切糊）。
  重新生成 .ico：用 tauri icon 指向本文件并指定输出目录，取输出里的 icon.ico。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024">
  <defs>
    <!-- 先从原始包轮廓挖出 logo 的圆形占位区。 -->
    <mask id="ocpack-brick-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff" />
      <circle cx="19" cy="19" r="7" fill="#000" />
    </mask>
    <!-- 环4（右上）要让开环1（左上）：距环1 圆心 425 以内一律不画，两环之间因此留下缝。 -->
    <mask id="ocpack-logo-gap" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1600" height="1600">
      <rect x="-100" y="-100" width="1600" height="1600" fill="#fff" />
      <circle cx="400" cy="400" r="425" fill="#000" />
    </mask>
  </defs>

  <!-- package-variant-closed 原始包轮廓。 -->
  <path fill="#808080" mask="url(#ocpack-brick-cutout)" d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.94 12.21 22 12 22C11.79 22 11.59 21.94 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.06 11.79 2 12 2C12.21 2 12.41 2.06 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5M12 4.15L10.11 5.22L16 8.61L17.96 7.5L12 4.15M6.04 7.5L12 10.85L13.96 9.75L8.08 6.35L6.04 7.5M5 15.91L11 19.29V12.58L5 9.21V15.91M19 15.91V9.21L13 12.58V19.29L19 15.91Z" />

  <!-- 4o 标志：单条合并路径，和 .ocblock 共用同一形状、尺寸与锚点。 -->
  <g transform="translate(14.1 14.1) scale(0.007)" fill="none" stroke="#808080" stroke-width="200">
    <path d="M400 100A300 300 0 1 0 400 700A300 300 0 1 0 400 100M400 700A300 300 0 1 0 700 1000M1000 700A300 300 0 1 1 1000 1300A300 300 0 1 1 1000 700M1000 700A300 300 0 0 0 1000 100" />
    <path d="M1000 700A300 300 0 1 0 700 400" mask="url(#ocpack-logo-gap)" />
  </g>
</svg>
