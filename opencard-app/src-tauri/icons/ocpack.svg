<?xml version="1.0" encoding="UTF-8"?>
<!--
  .ocpack 的文件类型图标：单个自足的 SVG，没有外部引用。
  · 包箱体就是你给的那条 mdi 路径（package-variant-closed-remove）去掉结尾的叉子：它自带
    右下角的徽标缺口，所以标志不需要衬底，箱体形状一个控制点都没动。
    上色：没有描边，只填灰色 #808080，透明度 10%（fill-opacity 0.9）。
  · 右下角放 OpenCard 的 4o 标志（形状取自 src/assets/opencard-logo-solid.svg，半径 300、环宽 200），
    占原来叉子那个 7x7 徽标框并放大到 140%：translate(14.1 14.1) scale(0.007)，即 9.8x9.8、
    中心仍在 (19,19)（原来那个叉子的中心），整块都在 0–24 画布内，不会被裁。
    上色与箱体一致：灰色 #808080、透明度 10%（stroke-opacity 0.9）——整张图只有一个灰色。
  · 环4 让开环1 的让位遮罩按源文件原样搬来（区域放大，免得描边外缘正好压在区域边界上被切糊）。
  重新生成 .ico：用 tauri icon 指向本文件并指定输出目录，取输出里的 icon.ico。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024">
  <defs>
    <!-- 环4（右上）要让开环1（左上）：距环1 圆心 425 以内一律不画，两环之间因此留下缝。 -->
    <mask id="ocpack-logo-gap" maskUnits="userSpaceOnUse" x="-100" y="-100" width="1600" height="1600">
      <rect x="-100" y="-100" width="1600" height="1600" fill="#fff" />
      <circle cx="400" cy="400" r="425" fill="#000" />
    </mask>
  </defs>

  <!-- 包箱体：灰色填充，透明度 10%，无描边（含自带缺口） -->
  <path fill="#808080" fill-opacity="0.9" d="M13 12.6L19 9.2V13C19.7 13 20.4 13.1 21 13.4V7.5C21 7.1 20.8 6.8 20.5 6.6L12.6 2.2C12.4 2.1 12.2 2 12 2S11.6 2.1 11.4 2.2L3.5 6.6C3.2 6.8 3 7.1 3 7.5V16.5C3 16.9 3.2 17.2 3.5 17.4L11.4 21.8C11.6 21.9 11.8 22 12 22S12.4 21.9 12.6 21.8L13.5 21.3C13.2 20.7 13.1 20 13 19.3M12 4.2L18 7.5L16 8.6L10.1 5.2L12 4.2M11 19.3L5 15.9V9.2L11 12.6V19.3M12 10.8L6 7.5L8 6.3L14 9.8L12 10.8" />

  <!-- 4o 标志：灰色描边，透明度 10%——尺寸取原来的 140%（0.005 -> 0.007，7 -> 9.8），
       仍然以徽标中心 (19,19) 为锚点（也就是原来那个叉子的中心） -->
  <g transform="translate(14.1 14.1) scale(0.007)" fill="none" stroke="#808080" stroke-opacity="0.9" stroke-width="200">
    <!-- 环1 左上整圈 + 环2 左下（缺第一象限）+ 环3 右下整圈 + 环4 右上的前 2/4：
         环4 与环3 的交接处放在同一条 path 里，描边先合并再上色，不会叠出更深的一小块 -->
    <path d="M400 100A300 300 0 1 0 400 700A300 300 0 1 0 400 100M400 700A300 300 0 1 0 700 1000M1000 700A300 300 0 1 1 1000 1300A300 300 0 1 1 1000 700M1000 700A300 300 0 0 0 1000 100" />
    <!-- 环4 右上的末尾 1/4：只有它需要让位遮罩（让开环1），所以单独留一条 -->
    <path d="M1000 100A300 300 0 0 0 700 400" mask="url(#ocpack-logo-gap)" />
  </g>
</svg>
