name: Move preview channel

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: preview-channel
  cancel-in-progress: false

jobs:
  move-pointer:
    name: Point the preview channel at the newest preview release
    if: github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # GitHub resolves no URL to the newest prerelease, so preview builds read the
      # updater document from this branch instead of a release asset.
      - name: Commit latest.json to the preview channel branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CHANNEL_BRANCH: preview-update
        run: |
          set -euo pipefail

          mkdir -p incoming
          if ! gh release download "$RELEASE_TAG" --pattern latest.json --dir incoming --clobber; then
            echo "Release $RELEASE_TAG publishes no latest.json, so the preview channel stays unchanged."
            exit 0
          fi

          # The channels never cross, so the pointer follows preview releases only
          # and only ever moves forward.
          if git fetch --depth=1 --quiet origin "refs/heads/$CHANNEL_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:latest.json" > incoming/pointer.json
            guard=0
            python3 - incoming/pointer.json incoming/latest.json <<'PY' || guard=$?
          import json, re, sys


          def sort_key(version):
              match = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?', version)
              if match is None:
                  raise SystemExit(f'unsupported release version: {version}')
              numbers = tuple(int(part) for part in match.group(1, 2, 3))
              prerelease = match.group(4)
              if prerelease is None:
                  return (numbers, (1,))
              identifiers = tuple(
                  (0, int(part), '') if part.isdigit() else (1, 0, part)
                  for part in prerelease.split('.')
              )
              return (numbers, (0, identifiers))


          with open(sys.argv[1]) as pointer:
              current = json.load(pointer)['version']
          with open(sys.argv[2]) as incoming:
              next_version = json.load(incoming)['version']

          if sort_key(next_version) > sort_key(current):
              print(f'{current} -> {next_version}')
              raise SystemExit(0)

          print(f'the preview channel already carries {current}, which is not older than {next_version}')
          raise SystemExit(1)
          PY
            case "$guard" in
              0) ;;
              1) exit 0 ;;
              *) echo "Could not compare the preview channel version with $RELEASE_TAG."; exit 1 ;;
            esac
          fi

          # One root commit, rewritten on every move, so the branch never accumulates
          # history. The local branch is a staging name; only the branch it points at
          # is pushed.
          git checkout --orphan channel-root
          git read-tree --empty
          find . -mindepth 1 -maxdepth 1 -not -name .git -not -name incoming -exec rm -rf {} +
          mv incoming/latest.json latest.json
          git add latest.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update the preview channel to $RELEASE_TAG"
          git push --force origin "HEAD:refs/heads/$CHANNEL_BRANCH"
          echo "The preview channel now points at $RELEASE_TAG."
