name: Build OpenCard Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: opencard-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opencard-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install NPM dependencies
        run: npm ci

      - name: Type check and test
        run: npm run verify

      - name: Read release notes
        id: release-notes
        shell: bash
        run: |
          echo 'body<<OPENCARD_RELEASE_NOTES_EOF' >> "$GITHUB_OUTPUT"
          cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
          echo 'OPENCARD_RELEASE_NOTES_EOF' >> "$GITHUB_OUTPUT"
          node -e "const fs = require('node:fs'); const version = require('./package.json').version; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'windows-bundle-args=' + (version.includes('-') ? '--bundles nsis' : '') + '\n')"

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: opencard-app
          args: ${{ matrix.platform == 'windows-latest' && steps.release-notes.outputs.windows-bundle-args || '' }}
          tagName: v__VERSION__
          releaseName: OpenCard v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true

      # Tauri's bundled bundle_dmg.sh sets the Finder background through a
      # relative HFS reference, which macOS 26+ accepts but never records, so
      # the image would ship with a plain window. Restyle it and replace the
      # asset tauri-action already uploaded.
      - name: Restyle macOS disk image
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          node scripts/restyle-dmg.mjs "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
