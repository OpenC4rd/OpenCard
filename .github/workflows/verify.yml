name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type check and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: opencard-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opencard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and test
        run: npm run verify

  worker:
    name: Feedback worker test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/feedback-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/feedback-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
